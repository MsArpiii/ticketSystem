{% extends "base.html" %}
{% block content %}

<div class="page-header">
    <h2 class="page-title">Edit Issue #{{ ticket.id }}</h2>
</div>

<div class="card" style="max-width: 600px;">
    <form method="POST">
        <div class="form-group">
            <label class="form-label" for="title">Title</label>
            <input type="text" name="title" id="title" class="form-control" value="{{ ticket.title }}" pattern=".*\S+.*" title="Title cannot be just spaces" maxlength="200" required>
        </div>
        
        <div class="form-group">
            <label class="form-label" for="desc">Description</label>
            <textarea name="desc" id="desc" class="form-control" rows="5" required>{{ ticket.description }}</textarea>
        </div>
        
        <div class="form-group mb-4">
            <label class="form-label" for="severity">Severity</label>
            <select name="severity" id="severity" class="form-control" required>
                <option value="Low" {% if ticket.severity == 'Low' %}selected{% endif %}>Low</option>
                <option value="Medium" {% if ticket.severity == 'Medium' %}selected{% endif %}>Medium</option>
                <option value="High" {% if ticket.severity == 'High' %}selected{% endif %}>High</option>
            </select>
        </div>
        
        <div class="flex gap-2">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ url_for('tickets.dashboard') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
