{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h2 class="page-title">New Issue</h2>
</div>

<div class="card" style="max-width: 600px;">
    <form method="POST">
        <div class="form-group">
            <label class="form-label" for="title">Title</label>
            <input type="text" name="title" id="title" class="form-control" placeholder="e.g. Cannot access database" pattern=".*\S+.*" title="Title cannot be just spaces" maxlength="200" required>
        </div>
        
        <div class="form-group">
            <label class="form-label" for="desc">Description</label>
            <textarea name="desc" id="desc" class="form-control" rows="5" placeholder="Provide details about the issue..." required></textarea>
        </div>
        
        <div class="form-group mb-4">
            <label class="form-label" for="severity">Severity</label>
            <select name="severity" id="severity" class="form-control" required>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select>
        </div>
        
        <button type="submit" class="btn btn-primary w-full">Create Issue</button>
    </form>
</div>
{% endblock %}
