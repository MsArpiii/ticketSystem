{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h2 class="page-title">My Profile</h2>
</div>

<div class="card text-center" style="padding: 3rem 2.5rem; max-width: 500px; margin: 0 auto;">
    <div style="width: 80px; height: 80px; background-color: var(--bg-surface-hover); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin: 0 auto 1.5rem; color: var(--text-tertiary);">👤</div>
    <h2 style="margin-bottom: 0.5rem; font-weight: 600; font-size: 1.75rem;">{{ current_user.username }}</h2>
    
    <div style="margin-bottom: 2rem;">
        <span class="text-secondary" style="font-size: 0.9rem; margin-right: 0.5rem;">Role:</span>
        {% if current_user.is_admin %}
            <span class="badge badge-severity-High">Administrator</span>
        {% else %}
            <span class="badge badge-severity-Low">User</span>
        {% endif %}
    </div>

    <div class="flex gap-2 justify-center pt-4" style="border-top: 1px solid var(--border-color);">
        <a href="{{ url_for('tickets.dashboard') }}" class="btn btn-secondary">My Tickets</a>
        <a href="{{ url_for('auth.logout') }}" class="btn btn-secondary" style="color: var(--danger);">Log Out</a>
    </div>
</div>
{% endblock %}
