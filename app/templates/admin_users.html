{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h2 class="page-title">User Management</h2>
</div>

<div class="dashboard-grid">
    {% for u in users %}
    <div class="card">
        <div class="card-header">
            <span class="ticket-id">ID: {{ u['id'] }}</span>
            {% if u['is_admin'] %}
                <span class="badge badge-severity-High">Admin</span>
            {% else %}
                <span class="badge badge-severity-Low">User</span>
            {% endif %}
        </div>
        
        <h3 class="ticket-title" style="font-size: 1.25rem;">{{ u['username'] }}</h3>
        
        <div class="card-footer">
            <button class="btn btn-secondary btn-sm" disabled style="opacity: 0.5;">Actions Locked</button>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
