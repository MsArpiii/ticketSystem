{% extends "base.html" %}
{% block content %}

<div class="page-header">
    <h2 class="page-title">System Analytics</h2>
</div>

<div class="dashboard-grid mb-4">
    <!-- Total Tickets -->
    <div class="card text-center" style="padding: 2.5rem 2rem;">
        <h3 class="text-secondary" style="font-size: 0.875rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem;">Total Tickets</h3>
        <div style="font-size: 3rem; font-weight: 700; color: var(--text-primary); line-height: 1;">{{ total }}</div>
    </div>
    
    <!-- Open Tickets -->
    <div class="card text-center" style="padding: 2.5rem 2rem;">
        <h3 class="text-secondary" style="font-size: 0.875rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem;">Open</h3>
        <div style="font-size: 3rem; font-weight: 700; color: var(--status-open-text); line-height: 1;">{{ open }}</div>
    </div>
    
    <!-- Resolved Tickets -->
    <div class="card text-center" style="padding: 2.5rem 2rem;">
        <h3 class="text-secondary" style="font-size: 0.875rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem;">Resolved</h3>
        <div style="font-size: 3rem; font-weight: 700; color: var(--status-resolved-text); line-height: 1;">{{ resolved }}</div>
    </div>
</div>

<h3 style="font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem;">Severity Breakdown</h3>

<div class="dashboard-grid">
    {% for sev in severity_data %}
    <div class="card" style="flex-direction: row; justify-content: space-between; align-items: center; padding: 1.5rem;">
        <span class="badge badge-severity-{{ sev.severity }}">{{ sev.severity }}</span>
        <span style="font-size: 1.5rem; font-weight: 700; color: var(--text-primary);">{{ sev.count }}</span>
    </div>
    {% endfor %}
</div>

{% endblock %}
