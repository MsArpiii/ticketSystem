{% extends "base.html" %}

{% block content %}
<div class="form-container" style="margin-top: 2rem;">
    <div class="card" style="padding: 2.5rem 2rem;">
        <h2 class="text-center" style="margin-bottom: 0.5rem; font-size: 1.75rem; font-weight: 600;">Welcome Back</h2>
        <p class="text-center text-secondary mb-4">Sign in to your account</p>

        <form method="POST">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" name="username" id="username" class="form-control" placeholder="admin" pattern=".*\S+.*" title="Username cannot be just spaces" required>
            </div>

            <div class="form-group mb-4">
                <label class="form-label" for="password">Password</label>
                <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary w-full">Sign In</button>
        </form>
        
        <p class="text-center text-secondary mt-4">
            Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a>
        </p>
    </div>
</div>
{% endblock %}
